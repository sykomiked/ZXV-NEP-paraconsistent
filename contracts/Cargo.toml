[workspace]
resolver = "2"
members = [
    "oracle-gateway",
    "ipc-bus",
    "execution-shield",
    "world-registry",
    "consumer-example",
    "micro-infer",
    "model-registry",
    "yhv-wrapper",
    "settlement-router",
    "paraconsistent-oracle",
    "ai-verdict",
    "verdict-guard",
    "treasury",
    "yhv-redeemer",
    "rails-registry",
    "rails-receipts",
    "zxv-core",
    "zxv-canonical",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sykomiked/ZXV-NEP-paraconsistent"

[workspace.dependencies]
near-sdk = "=5.9.0"
serde = { version = "1", features = ["derive"] }
# size-optimized builds: the scenic bypass for storage cost
[profile.release]
opt-level = "z"          # prioritize size
lto = true               # link-time optimization across the crate
codegen-units = 1        # single codegen unit for max inlining
panic = "abort"          # no unwind tables
strip = true             # drop symbol/debug sections
